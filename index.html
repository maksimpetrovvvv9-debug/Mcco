const container = document.getElementById('services-container');
services.forEach(svc => {
  const div = document.createElement('div');
  div.className = "bg-white rounded-2xl p-6 shadow mb-4";
  div.innerHTML = `
    <div class="flex justify-between items-start">
      <h3 class="text-xl font-semibold">${svc.title}</h3>
      <button class="toggle-btn px-4 py-2 border rounded" data-target="${svc.target}">Подробнее</button>
    </div>
    <div id="${svc.target}" class="accordion-panel mt-4">${svc.content}</div>
  `;
  container.appendChild(div);
});

// Аккордеон
document.querySelectorAll('.toggle-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const panel = document.getElementById(btn.dataset.target);
    const isOpen = panel.classList.contains('open');
    panel.classList.toggle('open');
    btn.classList.toggle('open', !isOpen);
    panel.style.maxHeight = !isOpen ? panel.scrollHeight + "px" : null;
  });
});

// Видео загрузка
document.querySelectorAll('.upload-video').forEach(input=>{
  input.addEventListener('change',e=>{
    const file = e.target.files[0];
    if(file && file.size <= 100*1024*1024){
      const video = document.getElementById(input.dataset.target);
      video.src = URL.createObjectURL(file);
    } else if(file){
      alert("Файл слишком большой! Максимум 100 МБ.");
      e.target.value = "";
    }
  });
});
